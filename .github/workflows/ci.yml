# Every push / PR: types, lint, unit + integration tests (incl. persistence, importer, Lumos, briefing,
# UGC, sync), production build, and real-browser smoke flows on an iPhone viewport.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: npx eslint src --quiet
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Smoke — importador (sem clipboard, iPhone)
        run: |
          npx vite preview --port 4319 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4319 >/dev/null && break; sleep 1; done
          node e2e/import-manual.mjs
